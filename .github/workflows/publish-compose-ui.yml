name: Publish Snacky Compose UI

# Runs when a compose-ui version tag (compose-v0.2.0, compose-v1.0.0, ...) is
# pushed. Prefixed "compose-v" (not "v") so it doesn't collide with
# publish-react-ui.yml's plain "v*.*.*" tags on the same repo. To cut a release:
#   1. Bump "version" in packages/compose-ui/gradle.properties
#   2. Commit that change
#   3. git tag compose-v0.2.0 && git push --tags
#
# Publishes to Maven Central via the Central Portal, using a Sonatype user
# token (username/password pair from Central Portal account settings, not
# your login password) plus a GPG key for artifact signing. Needs 4 repo
# secrets: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD,
# SIGNING_IN_MEMORY_KEY (armored private key), SIGNING_IN_MEMORY_KEY_PASSWORD.
#
# Untested end to end - this environment has no JDK/Gradle to run it against,
# so the first real tag push is the first real test. If a step's task name or
# plugin API has drifted, check the vanniktech/gradle-maven-publish-plugin
# changelog against whatever version gradle/libs.versions.toml resolves.
on:
  push:
    tags:
      - 'compose-v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/compose-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # No Gradle wrapper is checked in (packages/compose-ui/gradlew), so this
      # installs Gradle directly instead of relying on one - every later step
      # calls "gradle", not "./gradlew".
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Refuses to publish if the git tag and gradle.properties disagree, so a
      # stale tag or a forgotten version bump can't ship the wrong version.
      - name: Verify tag matches gradle.properties version
        run: |
          PKG_VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          TAG_VERSION="${GITHUB_REF_NAME#compose-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag compose-v$TAG_VERSION does not match gradle.properties version $PKG_VERSION"
            exit 1
          fi

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: gradle publishToMavenCentral --no-configuration-cache
